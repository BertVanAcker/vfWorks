name: BLDC torch training
root: .
working_directory: Processes
validity_frame:
  name: VF_TORCH
  config: config.yaml
  loadExistingVF: true
  VFPackage: .
active_model_structure: efb0eabb-185c-4bcf-8e15-2255ae34506c
actions:
  file: Processes/Actions/trainer.py
  class: trainingActions
tasks:
  - name: Collect data
    method: t_collect_data
  - name: Load model
    method: t_load_model
  - name: Model fitting
    method: t_fit_model
  - name: Evaluate model
    method: t_evaluate_model
  - name: Store model snapshot - pickled
    method: t_store_model_snapshot_pickled
  - name: Update validity frame package
    method: t_store_vf
