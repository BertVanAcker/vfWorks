[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "vfworks"
version = "0.0.2"
description = "A framework for validating, managing, and reusing AI models."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Jan Gladiné", email = "Jan.Gladine@uantwerpen.be" },
    { name = "Bert Van Acker" },
    { name = "Arkadiusz Michał Ryś", email = "Arkadiusz.Michal.Rys@gmail.com" },
]

keywords = [
    "model validation",
    "model reuse",
    "model-based engineering",
    "cyber-physical systems",
    "machine learning",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "click        >=8.1",
    "jinja2       >=3.1",
    "matplotlib   >=3.9",
    "neo4j        >=5.20",
    "networkx     >=3.3",
    "numpy        >=2.0",
#    "onnx         >=1.22",
    "pandas       >=2.2",
    "pyyaml       >=6.0",
    "redis        >=5.0",
#    "scikit-learn >=1.7",
#    "scipy        >=1.13",
    "termcolor    >=2.4",
    "textx        >=4.0",
]

[project.urls]
Homepage = "https://github.com/BertVanAcker/vfWorks"
Repository = "https://github.com/BertVanAcker/vfWorks"
Issues = "https://github.com/BertVanAcker/vfWorks/issues"

[project.scripts]
vfworks = "vfworks.__main__:cli"

[project.optional-dependencies]
ml = [
#    "ml-dtypes",
    "pycaret",
    "skl2onnx",
    "torch",
#    "torchvision",
    "ultralytics",
]

api = [
    "fastapi",
    "starlette",
    "uvicorn",
]

examples-bldc = [
    "odrive",
    "pyserial",
    "scikit-learn",
    "scipy",
]

examples-turtlebot-lidar = [
    "scikit-learn",
    "scipy",
    "tqdm",
]

examples-screw-detection = [
    "opencv-python",
    "pyrealsense2",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "deptry",
    "mypy",
    "pre-commit",
    "pytest-cov",
    "ruff",
    "pytest",
    "invoke",
    "vermin",
    "restview",
    {include-group = "test"},
    {include-group = "doc"},
]
test = [
    "httpx",
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-tabs",
    "sphinx-toolbox",
    "sphinxext-opengraph",
    "sphinx-notfound-page",
    "sphinxcontrib-drawio",
    "sphinxcontrib-mermaid",
    "readthedocs-sphinx-search",
    "myst-parser",
]

screw-detection = [
#    "modelguard==0.61.0", # This is some local package I do not have
#    "screw-assembly-monitoring", # This is some local package I do not have
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

#modelguard = { path = "examples/Labcases/Screw_detection/VF_Tool_Sandbox/VF_SCREWDETECTION/Resources/loaders/dist/modelguard-0.61.0-py3-none-any.whl" }  # I don't have this

#screw-assembly-monitoring = { path = "examples/Labcases/Screw_detection/screw_assembly_monitoring" } # I don't have this

[tool.uv.build-backend]
module-name = "vfworks"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.per_rule_ignores]
DEP003 = ["vfworks"]